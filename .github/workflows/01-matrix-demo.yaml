
name: Matrix Strategy Demo

on:
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version:
          - v1
          - v2
          - v3

    steps:
      - name: Checkout Repository ${{ matrix.version }}
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Execute Application
        run: |
          python app.py &
          APP_PID=$!

          sleep 5

          curl --fail http://127.0.0.1:5000/health

          echo "Application executed successfully."

          echo "Matrix Version: ${{ matrix.version }}"
          python --version

          kill $APP_PID
