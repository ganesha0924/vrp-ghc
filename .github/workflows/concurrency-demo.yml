
name: Job Concurrency Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Build started"
          sleep 30
          echo "Build completed"

  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Test started"
          sleep 30
          echo "Test completed"

  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deploy started"
          sleep 30
          echo "Deploy completed"
