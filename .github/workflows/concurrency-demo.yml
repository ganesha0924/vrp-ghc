
name: Job Concurrency Demo

on:
  workflow_dispatch:

jobs:
  build:
    concurrency:
      group: build-group
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Build started"
          sleep 30
          echo "Build completed"

  test:
    concurrency:
      group: test-group
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Test started"
          sleep 30
          echo "Test completed"

  deploy:
    concurrency:
      group: deploy-group
      cancel-in-progress: false
      
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deploy started"
          sleep 30
          echo "Deploy completed"
