jobs:
  build:
    concurrency:
      group: build-group
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - run: sleep 30

  test:
    concurrency:
      group: test-group
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - run: sleep 30

  deploy:
    concurrency:
      group: deploy-group
      cancel-in-progress: false

    runs-on: ubuntu-latest
    steps:
      - run: sleep 30