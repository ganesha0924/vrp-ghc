name: Sample GitHub Actions Workflow

on: push

jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Message
        run: echo "first job "

      - name: Check Current Directory
        run: pwd

      - name: List Files
        run: ls
  second-job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Message
        run: echo "seconfd job"

      - name: Check Current Directory
        run: pwd

      - name: List Files
        run: ls
